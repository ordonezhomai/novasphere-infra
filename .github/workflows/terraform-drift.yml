name: Terraform Drift

on:
  schedule:
    - cron: "0 3 * * *"   # chaque nuit a 3h UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

jobs:
  drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    defaults:
      run:
        shell: bash
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - run: terraform init -input=false
      # -detailed-exitcode : 0 = conforme, 1 = erreur, 2 = derive
      - name: Detection de derive
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=120s -detailed-exitcode > plan.txt
          code=$?
          cat plan.txt
          if [ "$code" -eq 2 ]; then
            echo "::error::Derive detectee sur ${{ matrix.env }} : la realite ne correspond plus au code"
            exit 1
          fi
          exit "$code"
