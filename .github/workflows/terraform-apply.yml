name: Terraform Apply

on:
  push:
    branches: [main]
    paths: ["envs/**", ".github/workflows/terraform-apply.yml"]
  schedule:
    - cron: "0 3 * * *" # detection de derive, chaque nuit a 3h UTC
  workflow_dispatch:
    inputs:
      action:
        description: "apply (dev puis prod) ou drift (detection de derive)"
        type: choice
        options: [apply, drift]
        default: apply

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_owner: hor
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

# Jamais deux deploiements en meme temps (en plus du verrou S3)
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply-dev:
    if: github.event_name == 'push' || inputs.action == 'apply'
    runs-on: ubuntu-latest
    env:
      TF_VAR_environment: dev
      TF_VAR_instance_type: t3.micro
      TF_VAR_vpc_cidr: 10.0.0.0/16
      TF_VAR_public_subnets: '["10.0.1.0/24", "10.0.2.0/24"]'
    defaults:
      run:
        shell: bash
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color -lock-timeout=300s -out=tfplan
      # On applique le fichier de plan, pas un nouveau plan
      - run: terraform apply -input=false -no-color tfplan
      - run: echo "Application dev -> $(terraform output -raw app_url)"

  apply-prod:
    needs: apply-dev
    if: github.event_name == 'push' || inputs.action == 'apply'
    runs-on: ubuntu-latest
    # Environnement GitHub protege : attend l'approbation d'un relecteur
    environment: prod
    env:
      TF_VAR_environment: prod
      TF_VAR_instance_type: t3.small
      TF_VAR_vpc_cidr: 10.1.0.0/16
      TF_VAR_public_subnets: '["10.1.1.0/24", "10.1.2.0/24"]'
    defaults:
      run:
        shell: bash
        working-directory: envs/prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color -lock-timeout=300s -out=tfplan
      - run: terraform apply -input=false -no-color tfplan
      - run: echo "Application prod -> $(terraform output -raw app_url)"

  drift:
    if: github.event_name == 'schedule' || inputs.action == 'drift'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            instance_type: t3.micro
            vpc_cidr: 10.0.0.0/16
            public_subnets: '["10.0.1.0/24", "10.0.2.0/24"]'
          - env: prod
            instance_type: t3.small
            vpc_cidr: 10.1.0.0/16
            public_subnets: '["10.1.1.0/24", "10.1.2.0/24"]'
    env:
      TF_VAR_environment: ${{ matrix.env }}
      TF_VAR_instance_type: ${{ matrix.instance_type }}
      TF_VAR_vpc_cidr: ${{ matrix.vpc_cidr }}
      TF_VAR_public_subnets: ${{ matrix.public_subnets }}
    defaults:
      run:
        shell: bash
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - run: terraform init -input=false
      # -detailed-exitcode : 0 = conforme, 1 = erreur, 2 = derive
      - name: Detection de derive
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=120s -detailed-exitcode > plan.txt
          code=$?
          cat plan.txt
          if [ "$code" -eq 2 ]; then
            echo "::error::Derive detectee sur ${{ matrix.env }} - la realite ne correspond plus au code"
            exit 1
          fi
          exit "$code"
