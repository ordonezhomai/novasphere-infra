name: Terraform Apply

on:
  push:
    branches: [main]
    paths: ["envs/**", ".github/workflows/terraform-apply.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

# Jamais deux deploiements en meme temps
concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply-dev:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color -lock-timeout=300s -out=tfplan
      # On applique le plan sauvegarde, pas un nouveau plan
      - run: terraform apply -input=false -no-color tfplan
      - run: echo "Application dev -> $(terraform output -raw app_url)"

  apply-prod:
    needs: apply-dev
    runs-on: ubuntu-latest
    # Environnement protege : attend l'approbation d'un relecteur
    environment: prod
    defaults:
      run:
        shell: bash
        working-directory: envs/prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - run: terraform init -input=false
      - run: terraform plan -input=false -no-color -lock-timeout=300s -out=tfplan
      - run: terraform apply -input=false -no-color tfplan
