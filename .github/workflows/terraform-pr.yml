name: Terraform PR

on:
  pull_request:
    paths: ["envs/**", ".github/workflows/**"]

# Le jeton GITHUB_TOKEN n'a que les droits declares ici.
# Jamais de pull_request_target : il exposerait les secrets a du code non relu.
permissions:
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_owner: hor
  TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive

  plan:
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: dev
            instance_type: t3.micro
            vpc_cidr: 10.0.0.0/16
            public_subnets: '["10.0.1.0/24", "10.0.2.0/24"]'
          - env: prod
            instance_type: t3.small
            vpc_cidr: 10.1.0.0/16
            public_subnets: '["10.1.1.0/24", "10.1.2.0/24"]'
    # Les differences dev/prod passent par les variables, comme terraform.tfvars en local
    env:
      TF_VAR_environment: ${{ matrix.env }}
      TF_VAR_instance_type: ${{ matrix.instance_type }}
      TF_VAR_vpc_cidr: ${{ matrix.vpc_cidr }}
      TF_VAR_public_subnets: ${{ matrix.public_subnets }}
    defaults:
      run:
        shell: bash
        working-directory: envs/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4

      # Learner Lab : identifiants de session du referent AWS (OIDC impossible, voir SECURITE.md)
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      - name: Plan
        run: terraform plan -input=false -no-color -lock-timeout=120s | tee plan.txt

      - name: Publier le plan dans la PR
        uses: actions/github-script@v7
        env:
          ENV_NAME: ${{ matrix.env }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENV_NAME;
            const plan = fs.readFileSync(`envs/${env}/plan.txt`, 'utf8');
            const resume = (plan.match(/^(Plan: .*|No changes\..*)$/m) || ['(voir le detail)'])[0];
            const body = `### Plan Terraform : \`${env}\`\n**${resume}**\n\n<details><summary>Afficher le plan complet</summary>\n\n\`\`\`\n${plan.slice(-60000)}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
